name: Repo Validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  release_audit:
    name: Repo Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check repository skill home
        uses: 8Dionysus/aoa-skills/.github/actions/home-skill-port@5ea0e38a2c405274dce870fb3750ec76fd01ba23

      - name: Check repo-local KAG index family
        uses: 8Dionysus/aoa-kag/.github/actions/repo-local-kag-index@58ab52ffc06bab5cc28842a0b4336c6efa16b6ff
        with:
          history-ref: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
          event-history-ref: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}

      - name: Checkout 8Dionysus
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/8Dionysus
          ref: c5209907175ced0b129b0cc3fa2cf505488a0517
          path: .deps/8Dionysus

      - name: Checkout aoa-agents
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-agents
          ref: 0acb7070c64ae00421d217a003ae3a844b2c816e
          path: .deps/aoa-agents

      - name: Checkout aoa-playbooks
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-playbooks
          ref: f0ea31c8d0d7286fefb5d5de8e103b3ca343e8a9
          path: .deps/aoa-playbooks

      - name: Checkout aoa-memo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-memo
          ref: 922e072f839d75e9f14c9afcd62a07fb8729fe2b
          path: .deps/aoa-memo

      - name: Checkout aoa-sdk
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-sdk
          ref: ac6c1e5f7dd824ebaa6a583c4bb8965e3ca194a0
          path: .deps/aoa-sdk

      - name: Checkout aoa-evals
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-evals
          ref: 4b5afa5c58080518ac5d1e47921601045c598bfc
          path: .deps/aoa-evals

      - name: Checkout abyss-machine
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/abyss-machine
          ref: ebd72a530c0b06c67140d6b38392a49e518f84ba
          path: .deps/abyss-machine

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run release audit
        env:
          AOA_8DIONYSUS_ROOT: ./.deps/8Dionysus
          AOA_AGENTS_ROOT: ./.deps/aoa-agents
          AOA_PLAYBOOKS_ROOT: ./.deps/aoa-playbooks
          AOA_MEMO_ROOT: ./.deps/aoa-memo
          AOA_SDK_ROOT: ./.deps/aoa-sdk
          AOA_EVALS_ROOT: ./.deps/aoa-evals
          ABYSS_MACHINE_REPO_ROOT: ./.deps/abyss-machine
        run: python scripts/release_check.py
